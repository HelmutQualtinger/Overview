<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffe9b8"/><stop offset="1" stop-color="#ffab5e"/>
    </linearGradient>
    <linearGradient id="skin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f7c8a2"/><stop offset=".55" stop-color="#e8a374"/><stop offset="1" stop-color="#c47648"/>
    </linearGradient>
    <radialGradient id="hl" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#fff" stop-opacity=".75"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="iron" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#66707a"/><stop offset=".4" stop-color="#2c3238"/><stop offset="1" stop-color="#121417"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f0f2f4"/><stop offset="1" stop-color="#868d94"/>
    </linearGradient>
  </defs>
  <rect width="120" height="120" fill="url(#bg)"/>
  <circle cx="22" cy="24" r="26" fill="#fff" opacity=".22"/>

  <!-- dumbbell, bar runs through the fist -->
  <rect x="50" y="19" width="56" height="5" rx="2" fill="url(#bar)" stroke="#5a6168" stroke-width=".6"/>
  <rect x="44" y="11" width="8" height="21" rx="2" fill="url(#iron)"/>
  <rect x="37" y="14" width="7" height="15" rx="2" fill="url(#iron)"/>
  <rect x="104" y="11" width="8" height="21" rx="2" fill="url(#iron)"/>
  <rect x="112" y="14" width="7" height="15" rx="2" fill="url(#iron)"/>

  <!-- flexed arm -->
  <path d="M0 62C9 50 22 41 36 41c14 0 22 9 25 18l4-23h22c4 14 6 28 3 39-3 10-12 15-26 15H0z" fill="url(#skin)" stroke="#9a5630" stroke-width="1.3" stroke-linejoin="round"/>
  <ellipse cx="32" cy="50" rx="14" ry="6" fill="url(#hl)"/>
  <ellipse cx="80" cy="56" rx="4" ry="10" fill="url(#hl)" opacity=".6"/>
  <path d="M61 59c1 3 3 5 6 6" fill="none" stroke="#9a5630" stroke-width="1.2" stroke-linecap="round"/>
  <path d="M14 66c8 2 18 2 30-1" fill="none" stroke="#b8693d" stroke-width="1" stroke-linecap="round" opacity=".6"/>
  <!-- fist -->
  <path d="M63 26c0-7 4-11 11-11h7c6 0 9 4 9 9v7c0 5-4 8-8 8H71c-5 0-8-4-8-8z" fill="url(#skin)" stroke="#9a5630" stroke-width="1.3"/>
  <g stroke="#9a5630" stroke-width="1" stroke-linecap="round"><path d="M70 16v9M76 15v9M82 15.5v9"/></g>
  <path d="M63 30c4 2 9 2 12 0" fill="none" stroke="#9a5630" stroke-width="1" stroke-linecap="round"/>
  <!-- effort lines -->
  <g stroke="#c0392b" stroke-width="2" stroke-linecap="round"><path d="M96 44l7-3M97 52h8M96 60l7 3"/></g>

  <!-- bicycle -->
  <g transform="translate(36 80)" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="14" cy="26" r="12" stroke="#1d2b3a" stroke-width="3"/>
    <circle cx="66" cy="26" r="12" stroke="#1d2b3a" stroke-width="3"/>
    <g stroke="#9aa5b1" stroke-width=".8"><path d="M14 14v24M2 26h24M5.5 17.5l17 17M22.5 17.5l-17 17M66 14v24M54 26h24M57.5 17.5l17 17M74.5 17.5l-17 17"/></g>
    <path d="M14 26L28 8h24l14 18M28 8l12 18 12-18M40 26H14" stroke="#1e88e5" stroke-width="3.2"/>
    <path d="M24 4h9M52 8l-2-7h7" stroke="#1d2b3a" stroke-width="3"/>
    <circle cx="40" cy="26" r="3" stroke="#1d2b3a" stroke-width="2"/>
  </g>
</svg>
