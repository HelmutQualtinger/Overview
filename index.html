<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Overview</title>
<meta name="description" content="Einstieg zu Qualtingers Kartei.">
<meta name="color-scheme" content="light dark">
<style>
  :root{
    --bg:#ffffff; --ink:#1d1d1f; --ink-soft:#6e6e73;
    --line:rgba(0,0,0,.12); --accent:#0066cc;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#000000; --ink:#f5f5f7; --ink-soft:#86868b;
      --line:rgba(255,255,255,.16); --accent:#2997ff;
    }
  }
  *{box-sizing:border-box}
  body{
    margin:0; min-height:100vh; padding:32px 20px;
    display:flex; align-items:center; justify-content:center;
    background:var(--bg); color:var(--ink);
    font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  main{width:100%; max-width:32rem}
  h1{margin:0 0 .4em; font-size:clamp(1.8rem,5vw,2.5rem); letter-spacing:-.02em}
  p{margin:0 0 2em; color:var(--ink-soft)}
  a.card{
    display:block; padding:20px 22px; border:1px solid var(--line);
    border-radius:16px; text-decoration:none; color:inherit;
    transition:border-color .15s ease, transform .15s ease;
  }
  a.card:hover{border-color:var(--accent); transform:translateY(-2px)}
  a.card strong{display:block; font-size:1.1rem; color:var(--accent)}
  a.card span{color:var(--ink-soft); font-size:.95rem}
</style>
</head>
<body>
<main>
  <h1>Overview</h1>
  <p>Einstieg zu den Projekten.</p>
  <a class="card" href="qualtingers-kartei.html">
    <strong>Qualtingers Kartei&nbsp;→</strong>
    <span>46 interaktive GitHub-Pages-Projekte zwischen Kabarett, Chaostheorie und Kartografie.</span>
  </a>
</main>
</body>
</html>
